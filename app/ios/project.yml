name: AuraCam
options:
  bundleIdPrefix: com.fairfigure
  deploymentTarget:
    iOS: '17.0'
settings:
  base:
    SWIFT_VERSION: '5.0'
    TARGETED_DEVICE_FAMILY: '1'
targets:
  AuraCam:
    type: application
    platform: iOS
    sources: [AuraCam]
    info:
      path: AuraCam/Info.plist
      properties:
        CFBundleDisplayName: AuraCam
        UILaunchScreen: {}
        NSBluetoothAlwaysUsageDescription: AuraCam connects to your Raspberry Pi to capture radio measurements and download artwork.
        NSPhotoLibraryAddUsageDescription: Save your selected radio artwork to Photos.
        UISupportedInterfaceOrientations: [UIInterfaceOrientationPortrait]
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.fairfigure.auracam
        CODE_SIGN_STYLE: Automatic
