<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>AuraCam / Session</title><style>*{box-sizing:border-box}body{background:white;color:#111;font:14px monospace;margin:0}main{max-width:1100px;margin:auto;padding:24px}header{border-top:5px solid;border-bottom:1px solid;padding:20px 0;display:flex;justify-content:space-between;align-items:center}h1{margin:0}button,select{font:inherit;border:1px solid #111;background:#fff;color:#111;padding:14px;cursor:pointer}button:disabled{opacity:.35;cursor:default}button.primary{background:#111;color:#fff}.controls{display:flex;gap:10px;flex-wrap:wrap;margin:20px 0}#status{font-size:20px;min-height:70px;padding:20px 0}#meta{color:#555;line-height:1.6}.grid{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:16px;margin:24px 0}.grid img{width:100%;display:block}.grid a{color:#111;font-size:12px;text-decoration:none}.grid span{display:block;padding:8px 0}select{max-width:100%}.note{font-size:12px;color:#555;line-height:1.6}#error{color:#a00}@media(max-width:650px){main{padding:16px}.grid{grid-template-columns:repeat(2,minmax(0,1fr))}header{gap:15px}h1{font-size:24px}}</style></head><body><main><header><h1>AURACAM / SESSION</h1><label><input type="checkbox" id="voice" checked> Voice cues</label></header><div id="status" role="status" aria-live="polite">Connecting to Pi…</div><div id="meta"></div><p id="error" role="alert"></p><div class="controls"><button id="survey">Start / new session</button><button id="baseline">Measure / rescan baseline</button><button id="lock">Lock baseline</button><button id="capture" class="primary">Capture / next guest</button></div><div class="controls"><select id="candidates" aria-label="Candidate frequency"></select><button id="tune">Lock frequency</button></div><p class="note">Keep antenna and gain fixed. Clear the marked spot for baseline capture. Moving the antenna requires recalibration. Candidate ranking measures signal strength and variation, not proven sensitivity to people. All rendering takes place on the Pi.</p><div id="gallery" class="grid"></div></main><script>
const $=id=>document.getElementById(id);let previous='',candidateKey='',galleryKey='',armed=false;
function speak(text){if(armed&&$('voice').checked&&'speechSynthesis' in window){speechSynthesis.cancel();speechSynthesis.speak(new SpeechSynthesisUtterance(text));}}
async function action(name){armed=true;try{if(name==='survey'&&!confirm('Start a new session? This clears the active baseline; saved files remain.'))return;const body={action:name};if(name==='tune')body.center_hz=+$('candidates').value;const r=await fetch('/api/action',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(body)});if(!r.ok)throw Error(r.status===409?'A Pi operation is already running.':'Could not start operation.');$('error').textContent='';speak('Starting. Follow the on-screen instructions.');}catch(e){$('error').textContent=e.message;}}
for(const id of ['survey','baseline','lock','capture','tune'])$(id).onclick=()=>action(id);
async function poll(){try{const r=await fetch('/api/state');if(!r.ok)throw Error('Pi unavailable');const s=await r.json();$('status').textContent=s.message+(s.remaining?' / '+s.remaining+'s':'');if(previous!==s.message){speak(s.message);previous=s.message;}const ready=['ready','baseline_review','locked','gallery'].includes(s.stage);$('survey').disabled=s.busy;$('baseline').disabled=s.busy||!ready;$('lock').disabled=s.busy||s.stage!=='baseline_review';$('capture').disabled=s.busy||!['locked','gallery'].includes(s.stage);$('tune').disabled=s.busy||!s.candidates.length;
$('meta').textContent=[s.session_id?'SESSION '+s.session_id:'',s.center_hz?'BAND CENTER '+(s.center_hz/1e6).toFixed(2)+' MHz / GAIN 20.7 dB':'',s.baseline?'BASELINE '+s.baseline.id+' / VARIATION '+s.baseline.variation_db+' dB / '+s.baseline.samples+' readings':''].filter(Boolean).join(' — ');
const ck=JSON.stringify(s.candidates);if(ck!==candidateKey){candidateKey=ck;$('candidates').replaceChildren();for(const c of s.candidates){const o=document.createElement('option');o.value=c.center_hz;o.textContent=`${(c.center_hz/1e6).toFixed(2)} MHz / ${c.power_db} dB / variation ${c.variation_db}`;$('candidates').append(o);}}
const gk=JSON.stringify(s.gallery);if(gk!==galleryKey){galleryKey=gk;$('gallery').replaceChildren();for(const url of s.gallery){const a=document.createElement('a');a.href=url;a.download=url.split('/').pop();const im=document.createElement('img');im.src=url;im.alt=a.download;im.loading='lazy';const text=document.createElement('span');text.textContent=a.download.replace('.png','')+' / DOWNLOAD';a.append(im,text);$('gallery').append(a);}}}catch(e){$('error').textContent='Connection lost. Check that the Pi session server is running.';}finally{setTimeout(poll,1000);}}
poll();
</script></body></html>
